version: '3.8'

services:
  web:
    build: .
    expose: #makes 5002 available to other hosts on the Docker network
    - "5002"
    depends_on:
    - redis
    environment:
    - REDIS_HOST=redis
    - REDIS_PORT=6379
  
  redis:
      image: "redis:latest"
      ports:
      - "6379:6379"
      # This makes sure the redis' data persists even if the container is stopped or removed
      volumes:
      - redis-data:/data
  nginx:
    image: nginx:latest
    ports:
    - "5002:5002"
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
    - web


volumes:
  redis-data: